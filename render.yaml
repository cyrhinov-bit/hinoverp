services:
  - type: web
    name: hinov-erp
    runtime: static
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

